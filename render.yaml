# Render blueprint for UNMUTE — Django backend + Vite/React frontend + Postgres.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: unmute-db
    plan: basic-256mb   # paid: no 30-day expiry, daily backups. ↑ to basic-1gb / basic-4gb / pro-4gb for more
    diskSizeGB: 1       # storage, independent of the compute plan; grow as needed

services:
  # --- Django backend: API, USSD, admin ---
  - type: web
    name: unmute-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unmute-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_ORIGIN       # frontend host, for CORS/CSRF
        fromService:
          type: web
          name: unmute-frontend
          property: host
      - key: PYTHON_VERSION
        value: "3.12.8"

  # --- Vite/React frontend: static site ---
  - type: web
    name: unmute-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # Set after the first deploy to the backend URL,
      # e.g. https://unmute-backend.onrender.com — then redeploy the frontend.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
